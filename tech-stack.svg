    <!-- Scan line gradient -->
    <linearGradient id="scanGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="rgba(0,255,255,0)" />
      <stop offset="45%" stop-color="rgba(0,255,255,0)" />
      <stop offset="50%" stop-color="rgba(0,255,255,0.15)" />
      <stop offset="55%" stop-color="rgba(0,255,255,0)" />
      <stop offset="100%" stop-color="rgba(0,255,255,0)" />
    </linearGradient>

    <!-- Horizontal scan sweep gradient -->
    <linearGradient id="sweepGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="rgba(0,255,255,0)"/>
      <stop offset="40%" stop-color="rgba(0,255,255,0)"/>
      <stop offset="50%" stop-color="rgba(0,255,255,0.12)"/>
      <stop offset="60%" stop-color="rgba(0,255,255,0)"/>
      <stop offset="100%" stop-color="rgba(0,255,255,0)"/>
    </linearGradient>
  </defs>

  <style>
    /* Floating keyframes */
    @keyframes float0 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }
    @keyframes float1 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-5px)} }
    @keyframes float2 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3.5px)} }
    @keyframes float3 { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4.5px)} }

    /* Pulse glow keyframes */
    @keyframes pulse {
      0%,100%{ opacity: 0.7 }
      50%{ opacity: 1 }
    }

    /* Scan line sweep */
    @keyframes scanSweep {
      0%{ transform: translateY(-30px) }
      100%{ transform: translateY(230px) }
    }

    /* Horizontal sweep */
    @keyframes hSweep {
      0%{ transform: translateX(-200px) }
      100%{ transform: translateX(1050px) }
    }

    /* Scanline texture flicker */
    @keyframes scanlines {
      0%,100%{ opacity: 0.03 }
      50%{ opacity: 0.06 }
    }

    /* Card classes */
    .card { animation: pulse 3s ease-in-out infinite; }
    .card-r0c0 { animation: float0 3.0s ease-in-out infinite 0.0s, pulse 3s ease-in-out infinite; }
    .card-r0c1 { animation: float1 3.2s ease-in-out infinite 0.3s, pulse 3s ease-in-out infinite 0.2s; }
    .card-r0c2 { animation: float2 3.4s ease-in-out infinite 0.6s, pulse 3s ease-in-out infinite 0.4s; }
    .card-r0c3 { animation: float3 3.1s ease-in-out infinite 0.9s, pulse 3s ease-in-out infinite 0.6s; }
    .card-r1c0 { animation: float1 3.3s ease-in-out infinite 0.2s, pulse 3s ease-in-out infinite 0.3s; }
    .card-r1c1 { animation: float2 3.5s ease-in-out infinite 0.5s, pulse 3s ease-in-out infinite 0.5s; }
    .card-r1c2 { animation: float0 3.2s ease-in-out infinite 0.8s, pulse 3s ease-in-out infinite 0.7s; }
    .card-r1c3 { animation: float3 3.4s ease-in-out infinite 1.1s, pulse 3s ease-in-out infinite 0.9s; }
    .card-r2c0 { animation: float2 3.1s ease-in-out infinite 0.4s, pulse 3s ease-in-out infinite 0.1s; }
    .card-r2c1 { animation: float0 3.6s ease-in-out infinite 0.7s, pulse 3s ease-in-out infinite 0.8s; }
    .card-r2c2 { animation: float3 3.3s ease-in-out infinite 1.0s, pulse 3s ease-in-out infinite 0.5s; }
    .card-r2c3 { animation: float1 3.5s ease-in-out infinite 1.3s, pulse 3s ease-in-out infinite 1.0s; }

    .scan-overlay {
      animation: scanSweep 4s linear infinite;
    }

    .h-sweep {
      animation: hSweep 6s ease-in-out infinite;
    }

    .scanline-texture {
      animation: scanlines 2s ease-in-out infinite;
    }

    .card-label {
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .hud-corner {
      fill: none;
      stroke: rgba(0,255,255,0.15);
      stroke-width: 1;
    }
  </style>

