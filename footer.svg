<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 120" width="100%">
  <defs>
    <linearGradient id="footerBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#161b22"/>
      <stop offset="100%" style="stop-color:#0d1117"/>
    </linearGradient>
    <linearGradient id="lineGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:transparent"/>
      <stop offset="20%" style="stop-color:#58a6ff"/>
      <stop offset="50%" style="stop-color:#7ee787"/>
      <stop offset="80%" style="stop-color:#d2a8ff"/>
      <stop offset="100%" style="stop-color:transparent"/>
    </linearGradient>
    <filter id="textGlow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feFlood flood-color="#58a6ff" flood-opacity="0.4" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="dotGlowF">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feFlood flood-color="#7ee787" flood-opacity="0.6" result="color"/>
      <feComposite in="color" in2="blur" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <style>
    @keyframes gradientShift {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }
    @keyframes floatUp {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-3px); }
    }
    @keyframes twinkleF {
      0%, 100% { opacity: 0.1; }
      50% { opacity: 0.8; }
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.4; r: 2; }
      50% { opacity: 1; r: 3; }
    }
    .gradient-line { animation: gradientShift 3s ease-in-out infinite; }
    .float { animation: floatUp 4s ease-in-out infinite; }
    .star { animation: twinkleF 3s ease-in-out infinite; }
    .dot-pulse { animation: pulse 2s ease-in-out infinite; }
    .star-d1 { animation-delay: 0s; }
    .star-d2 { animation-delay: 0.5s; }
    .star-d3 { animation-delay: 1s; }
    .star-d4 { animation-delay: 1.5s; }
    .star-d5 { animation-delay: 2s; }
    .star-d6 { animation-delay: 2.5s; }
  </style>

  <!-- Background -->
  <rect width="850" height="120" fill="url(#footerBg)" rx="5"/>
  
  <!-- Animated gradient line -->
  <rect x="50" y="15" width="750" height="2" fill="url(#lineGrad)" rx="1" class="gradient-line"/>

  <!-- Floating stars -->
  <circle cx="100" cy="50" r="1" fill="#58a6ff" class="star star-d1"/>
  <circle cx="200" cy="35" r="1.5" fill="#d2a8ff" class="star star-d2"/>
  <circle cx="350" cy="60" r="1" fill="#7ee787" class="star star-d3"/>
  <circle cx="500" cy="40" r="1.2" fill="#58a6ff" class="star star-d4"/>
  <circle cx="650" cy="55" r="1" fill="#d2a8ff" class="star star-d5"/>
  <circle cx="750" cy="38" r="1.5" fill="#7ee787" class="star star-d6"/>
  <circle cx="150" cy="70" r="0.8" fill="#ff7b72" class="star star-d3"/>
  <circle cx="420" cy="30" r="1" fill="#ff7b72" class="star star-d1"/>
  <circle cx="580" cy="65" r="1.3" fill="#58a6ff" class="star star-d5"/>
  <circle cx="300" cy="80" r="0.8" fill="#7ee787" class="star star-d4"/>

  <!-- Center content -->
  <g class="float">
    <!-- Quote -->
    <text x="425" y="55" text-anchor="middle" font-family="'Courier New', monospace" font-size="12" fill="#484f58">
      <tspan fill="#58a6ff">"</tspan>Code is poetry written in logic<tspan fill="#58a6ff">"</tspan>
    </text>
    
    <!-- Profile link line -->
    <text x="425" y="80" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="11" fill="#30363d">
      ⚡ Made with <tspan fill="#ff7b72">♥</tspan> by <tspan fill="#58a6ff" font-weight="600">Vishal Choudhary</tspan>
    </text>
  </g>

  <!-- Bottom accent dots -->
  <g>
    <circle cx="390" cy="100" r="2" fill="#7ee787" class="dot-pulse" filter="url(#dotGlowF)" style="animation-delay: 0s"/>
    <circle cx="410" cy="100" r="2" fill="#58a6ff" class="dot-pulse" style="animation-delay: 0.3s"/>
    <circle cx="430" cy="100" r="2" fill="#d2a8ff" class="dot-pulse" style="animation-delay: 0.6s"/>
    <circle cx="450" cy="100" r="2" fill="#ff7b72" class="dot-pulse" style="animation-delay: 0.9s"/>
    <circle cx="470" cy="100" r="2" fill="#FCC624" class="dot-pulse" style="animation-delay: 1.2s"/>
  </g>

  <!-- Corner accents -->
  <polyline points="5,12 5,5 12,5" fill="none" stroke="rgba(88,166,255,0.2)" stroke-width="1"/>
  <polyline points="838,5 845,5 845,12" fill="none" stroke="rgba(88,166,255,0.2)" stroke-width="1"/>
  <polyline points="5,108 5,115 12,115" fill="none" stroke="rgba(88,166,255,0.2)" stroke-width="1"/>
  <polyline points="838,115 845,115 845,108" fill="none" stroke="rgba(88,166,255,0.2)" stroke-width="1"/>
</svg>
